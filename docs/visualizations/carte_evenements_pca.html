        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip');
        
        // Configuration des couleurs
        const colors = {
            1: '#FF6B6B', // Rouge - Notoriété faible
            2: '#FFA06B', // Orange
            3: '#FFD06B', // Jaune
            4: '#6BFF6B', // Vert clair
            5: '#6B6BFF'  // Bleu - Notoriété élevée
        };
        
        // Variables pour le zoom et le pan
        let scale = 1;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        
        // Fonction pour dessiner la carte
        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            
            // Appliquer transformations
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(scale, scale);
            ctx.translate(-canvas.width/2 + offsetX, -canvas.height/2 + offsetY);
            
            // Dessiner les points
            data.points.forEach(point => {
                // Normaliser les coordonnées
                const x = ((point.x - data.stats.bounds.x[0]) / (data.stats.bounds.x[1] - data.stats.bounds.x[0])) * canvas.width;
                const y = ((point.y - data.stats.bounds.y[0]) / (data.stats.bounds.y[1] - data.stats.bounds.y[0])) * canvas.height;
                
                // Dessiner le point
                ctx.beginPath();
                ctx.arc(x, y, point.size, 0, 2 * Math.PI);
                ctx.fillStyle = colors[point.color] || '#999';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });
            
            ctx.restore();
        }
        
        // Gestion des interactions
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStartX = e.clientX - offsetX;
            dragStartY = e.clientY - offsetY;
            canvas.style.cursor = 'grabbing';
        });
        
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            if (isDragging) {
                offsetX = e.clientX - dragStartX;
                offsetY = e.clientY - dragStartY;
                drawMap();
            } else {
                // Vérifier le survol
                const transformedX = (mouseX - canvas.width/2) / scale + canvas.width/2 - offsetX;
                const transformedY = (mouseY - canvas.height/2) / scale + canvas.height/2 - offsetY;
                
                let hoveredPoint = null;
                
                data.points.forEach(point => {
                    const x = ((point.x - data.stats.bounds.x[0]) / (data.stats.bounds.x[1] - data.stats.bounds.x[0])) * canvas.width;
                    const y = ((point.y - data.stats.bounds.y[0]) / (data.stats.bounds.y[1] - data.stats.bounds.y[0])) * canvas.height;
                    
                    const distance = Math.sqrt((transformedX - x) ** 2 + (transformedY - y) ** 2);
                    if (distance < point.size * scale) {
                        hoveredPoint = point;
                    }
                });
                
                if (hoveredPoint) {
                    tooltip.style.display = 'block';
                    tooltip.style.left = e.pageX + 15 + 'px';
                    tooltip.style.top = e.pageY - 40 + 'px';
                    tooltip.innerHTML = `
                        <strong>${hoveredPoint.title}</strong><br>
                        📅 ${hoveredPoint.date}<br>
                        🎨 Notoriété: ${hoveredPoint.color}/5<br>
                        📂 Catégorie: ${hoveredPoint.category}
                    `;
                    canvas.style.cursor = 'pointer';
                } else {
                    tooltip.style.display = 'none';
                    canvas.style.cursor = isDragging ? 'grabbing' : 'crosshair';
                }
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });
        
        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            tooltip.style.display = 'none';
            canvas.style.cursor = 'crosshair';
        });
        
        // Zoom avec la molette
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const newScale = scale * delta;
            
            if (newScale >= 0.5 && newScale <= 5) {
                scale = newScale;
                drawMap();
            }
        });
        
        // Dessin initial
        drawMap();
    </script>
